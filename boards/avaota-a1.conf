# Avaota A1
BOARD_NAME="avaota-a1"
DEVICE_DTS="allwinner/sun55i-t527-avaota-a1"
ARCH="arm64"
KERNEL_BRANCH="bsp"
KERNEL_GCC="aarch64-linux-gnu-"
# 固定分区 UUID (mkfs 时写入, 供 root=/fstab 引用; 避免 label 冲突)
ROOT_UUID="d88a2c3e-7f4b-4e11-9c8a-5d2b1f3a6e7c"
BOOT_UUID="1A2B-3C4D"
# cma=256M: 双 2560x1440 屏需 ~90MB+ 扫描缓冲, 64M 会 OOM
BOOTARGS="root=UUID=${ROOT_UUID} earlycon=uart8250,mmio32,0x02500000 clk_ignore_unused console=ttyAS0,115200 loglevel=8 cma=256M init=/sbin/init rw fsck.fix=yes fsck.repair=yes net.ifnames=0"

case "${KERNEL_TARGET}" in

	bsp)
		# Linux 5.15 kernel configure
		LINUX_REPO="https://github.com/AvaotaSBC/linux.git"
		LINUX_GITEE_REPO="https://github.com/AvaotaSBC/linux.git"
		LINUX_BRANCH="linux-5.15"
		LINUX_CONFIG="sun55i_t527_bsp_defconfig"
		# 板级内核补丁目录 (patches/kernel/avaota-a1-bsp): DP 口 dts 修复等
		LINUX_PATHDIR="avaota-a1-bsp"
		;;

esac

setup_dhcp(){
if [[ "${VERSION}" == "jammy" || "${VERSION}" == "noble" ]];then
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth0.dhcp4=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth0.dhcp6=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth1.dhcp4=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth1.dhcp6=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} sudo chmod 600 /etc/netplan/*.yaml
fi
}

# Bootloader: 主线 u-boot (Armbian sun55iw3 同款方案)
# BL31 来自 Jernej Skrabec 的 ATF fork (主线 ATF 尚无 sun55i plat)
BL_CONFIG="sunxi-uboot"
UBOOT_REPO="https://github.com/u-boot/u-boot.git"
UBOOT_BRANCH="v2026.07"
ATF_REPO="https://github.com/jernejsk/arm-trusted-firmware.git"
ATF_BRANCH="a523-v4"
ATF_PLAT="sun55i_a523"
BL_CONF="avaota-a1_defconfig"
BL_PATCHDIR="avaota-a1"
